<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#4F8AF7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4F8AF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="60%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4" cx="10%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8AF7"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="#08080B"/>

  <!-- Gradient mesh -->
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>
  <rect width="1200" height="630" fill="url(#g4)"/>

  <!-- Grid pattern (subtle) -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="14" fill="#08080B" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
    <path d="M20 22h12a10 10 0 1 1 0 20H20zm0 0v20"
          stroke="url(#logo-grad)" stroke-width="6"
          stroke-linecap="round" fill="none"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="260"
        font-family="-apple-system, 'Segoe UI', Inter, sans-serif"
        font-size="22" font-weight="500"
        fill="#B4B4BF" letter-spacing="4">
    AUTOMATIZACIÓN · DESARROLLO · IA
  </text>

  <!-- Title -->
  <text x="80" y="360"
        font-family="-apple-system, 'Segoe UI', Geist, sans-serif"
        font-size="92" font-weight="700"
        fill="#FFFFFF" letter-spacing="-3">
    Soluciones inteligentes
  </text>
  <text x="80" y="460"
        font-family="-apple-system, 'Segoe UI', Geist, sans-serif"
        font-size="92" font-weight="700"
        fill="url(#title-grad)" letter-spacing="-3">
    para tu negocio.
  </text>

  <!-- Bottom strip with brands -->
  <g transform="translate(80, 540)">
    <text font-family="-apple-system, 'Segoe UI', Inter, sans-serif"
          font-size="20" font-weight="600" fill="#FFFFFF">
      <tspan>Devindry</tspan>
      <tspan fill="#4F8AF7" dx="6">•</tspan>
      <tspan dx="6">Cleverum</tspan>
      <tspan fill="#7C5CFF" dx="6">•</tspan>
      <tspan dx="6">Wabbi</tspan>
    </text>
  </g>

  <text x="1120" y="565"
        text-anchor="end"
        font-family="-apple-system, 'Segoe UI', Inter, sans-serif"
        font-size="20" font-weight="500"
        fill="#B4B4BF" letter-spacing="2">
    cleverum.org
  </text>
</svg>
